name: Food Deals Debug Dump

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r scripts/food_deals/requirements.txt
          playwright install --with-deps chromium
      - run: python scripts/food_deals/debug_dump.py
      - uses: actions/upload-artifact@v4
        with:
          name: marktguru-debug
          path: |
            debug.html
            debug.png
