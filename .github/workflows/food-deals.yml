name: Daily Food Deals Check

on:
  schedule:
    # 06:30 UTC ≈ 07:30/08:30 Europe/Berlin depending on DST
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/food_deals/requirements.txt
          playwright install --with-deps chromium

      - name: Run food deals check
        env:
          SMTP_USER: ${{ secrets.FOOD_DEALS_SMTP_USER }}
          SMTP_PASS: ${{ secrets.FOOD_DEALS_SMTP_PASS }}
          MAIL_TO: ${{ secrets.FOOD_DEALS_MAIL_TO }}
        run: python scripts/food_deals/check_food_deals.py

      - name: Persist seen-offers state
        run: |
          git config user.name "food-deals-bot"
          git config user.email "actions@github.com"
          git add scripts/food_deals/seen_offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen food deals"
            git push
          fi
