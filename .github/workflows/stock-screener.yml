name: Daily Stock Screener

on:
  schedule:
    # 21:30 UTC, nach US-Börsenschluss, Montag bis Freitag
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Screener laufen lassen
        run: python scripts/screener/run_screener.py

      - name: Ergebnis committen
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@github.com"
          git add data/screener/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock screener data"
            git pull --rebase
            git push
          fi
